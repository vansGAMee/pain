plugins { id 'com.android.application' }
android {
 namespace 'dev.mono.local'
 compileSdk 36
 defaultConfig {
  applicationId 'dev.mono.local'; minSdk 26; targetSdk 35
  versionCode 3; versionName '0.1.2'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
 lint { abortOnError true }
}
dependencies {
 implementation 'androidx.core:core:1.9.0'
 implementation 'androidx.annotation:annotation:1.6.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 implementation 'androidx.media3:media3-exoplayer:1.9.3'
 implementation 'androidx.media3:media3-session:1.9.3'
 testImplementation 'junit:junit:4.13.2'
}
